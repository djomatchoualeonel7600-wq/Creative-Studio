<style>
.hello{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap;margin:2.5rem 0 1.25rem}
.relay{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media (max-width:700px){.relay{grid-template-columns:1fr}}
.relay .thread{max-height:15rem}
.fwd{background:none;border:0;color:var(--halo);font-size:.6875rem;cursor:pointer;padding:0;margin-top:.25rem;text-decoration:underline}
.raw{margin-top:.3rem;padding:.4rem .55rem;border-radius:.5rem;background:rgba(232,176,75,.1);color:var(--warn);font-size:.6875rem}
.elig td:first-child{font-weight:500}
.elig tr.hand td{background:rgba(0,176,255,.06)}
.lvl{display:flex;gap:.25rem;align-items:center}
.lvl i{width:2.6rem;height:.35rem;border-radius:99rem;background:rgba(220,198,144,.15);overflow:hidden;display:block}
.lvl i b{display:block;height:100%;background:linear-gradient(90deg,var(--champagne),#FFF4DC)}
.locked{opacity:.5;pointer-events:none}
.formula{font-size:.875rem;padding:.8rem 1rem;border-radius:.8rem;background:var(--card);border:1px solid var(--glass-line);margin:.5rem 0 1rem}
</style>
