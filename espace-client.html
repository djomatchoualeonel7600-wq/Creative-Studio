<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" href="brand/creative-studio-mark.png">
<title>Mon espace client · Creative Studio</title>
<link rel="stylesheet" href="plateforme/plateforme.css">
<style>
.oc{display:block;width:100%;text-align:left;cursor:pointer;border-radius:1rem;border:1px solid rgba(220,198,144,.16);background:var(--card);padding:1rem;transition:.3s var(--ease)}
.oc + .oc{margin-top:.6rem}
.oc:hover{border-color:rgba(0,176,255,.5);transform:translateY(-2px)}
.oc .row.between b{font-weight:500}
.todo{display:flex;gap:.7rem;align-items:flex-start;width:100%;text-align:left;cursor:pointer;border:1px solid rgba(232,176,75,.35);background:rgba(232,176,75,.06);border-radius:.85rem;padding:.75rem .85rem;font-size:.8125rem}
.todo + .todo{margin-top:.5rem}
.todo i{flex:none;width:.55rem;height:.55rem;margin-top:.35rem;border-radius:50%;background:var(--warn);box-shadow:0 0 .6rem var(--warn)}
.todo small{display:block;color:var(--muted);font-size:.6875rem}
.sw8{display:flex;gap:.4rem}.sw8 span{width:2.2rem;height:2.2rem;border-radius:.6rem;border:1px solid var(--glass-line)}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.ab button{padding:0;border-radius:1rem;overflow:hidden;border:2px solid var(--glass-line);background:#000;cursor:pointer;position:relative}
.ab button img{width:100%;aspect-ratio:4/3;object-fit:cover}
.ab button b{position:absolute;left:.6rem;top:.6rem;padding:.25rem .6rem;border-radius:99rem;background:rgba(8,6,5,.75);font-weight:500;font-size:.75rem;color:#fff}
.ab button[aria-pressed="true"]{border-color:var(--champagne);box-shadow:0 0 0 2px var(--champagne)}
.hello{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap;margin:2.5rem 0 1.5rem}
.sug{display:flex;align-items:center;gap:.7rem;padding:.6rem .7rem;border-radius:.8rem;border:1px solid rgba(220,198,144,.14);text-decoration:none;font-size:.8125rem;transition:.25s}
.sug:hover{border-color:rgba(0,176,255,.5)}
.sug .ico{display:grid;place-items:center;width:2rem;height:2rem;border-radius:.6rem;background:rgba(220,198,144,.12);color:var(--champagne)}.sug .ico svg{width:1.05rem;height:1.05rem}
.sug + .sug{margin-top:.45rem}
</style>
</head>

</html>
